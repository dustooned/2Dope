<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>2Dope Pen Lab</title>
  </head>
  <body>
    <header class="topbar">
      <strong class="logo">2Dope <span>pen lab · M0</span></strong>
      <button type="button" id="panel-toggle" title="Brush settings and X-sheet">Panel</button>
      <div class="group file" role="group" aria-label="Project">
        <input id="pname" type="text" placeholder="Untitled" maxlength="60" aria-label="Project name" />
        <button type="button" data-file="save" title="Save a .2dope file (a backup you keep)">Save</button>
        <button type="button" data-file="open" title="Open a .2dope file">Open</button>
        <button type="button" data-file="new" title="New project (the current one is kept under Versions)">New</button>
        <button type="button" data-file="versions" title="Restore points">Versions</button>
        <span id="savestatus" class="readout" role="status"></span>
        <span id="storage" class="readout"></span>
        <input id="openfile" type="file" accept=".2dope,.zip,.json,application/zip,application/json" hidden />
      </div>
      <div class="group" role="group" aria-label="Tools">
        <button type="button" data-tool="brush" title="Brush (B)">Brush</button>
        <button type="button" data-tool="eraser" title="Eraser (E)">Eraser</button>
        <button type="button" data-tool="pen" title="Vector pen (P)">Vector</button>
        <button type="button" data-tool="fill" title="Fill (G): fills the area under the click, below the lines">Fill</button>
      </div>
      <div class="group" role="group" aria-label="Draws on" title="Which plane brushes and the eraser write to (X). Fills always sit under the lines.">
        <span class="name">On</span>
        <button type="button" data-plane="line" title="Line plane: linework">Line</button>
        <button type="button" data-plane="fill" title="Fill plane: flat color, under the lines">Fill</button>
      </div>
      <div class="group" role="group" aria-label="History">
        <button type="button" data-action="undo" title="Undo (Ctrl+Z, two-finger tap)">Undo</button>
        <button type="button" data-action="redo" title="Redo (Ctrl+Shift+Z, three-finger tap)">Redo</button>
        <button type="button" data-action="clear" title="Clear this drawing (undoable)">Clear</button>
      </div>
      <div class="group" role="group" aria-label="View">
        <button type="button" data-action="fit" title="Fit (F)">Fit</button>
        <button type="button" data-action="actual" title="100% (1)">100%</button>
        <button type="button" data-action="rotate0" title="Reset rotation (0)">0°</button>
        <button type="button" data-action="flip" title="Flip view (H)">Flip</button>
        <span id="viewinfo" class="readout"></span>
      </div>
      <label class="check"><input id="finger" type="checkbox" /> Finger paints</label>
      <button type="button" data-action="export" title="Export this frame as PNG with alpha">PNG</button>
      <button type="button" id="export-seq" title="Export the whole shot as PNG sequences with alpha (Lines / Fills / Matte passes)">Export…</button>
      <button type="button" id="enter-quick" title="Quick Animate: just the canvas, a slim strip and the essentials (Tab)">Quick Animate</button>
      <button type="button" data-action="hide" title="Hide interface (Shift+Tab, four-finger tap)">Hide UI</button>
    </header>
    <main class="workspace">
      <div class="stage-col">
        <div id="stage" class="stage">
          <canvas id="canvas" aria-label="Drawing canvas"></canvas>
          <div id="stats" class="stats">Draw with a pen, mouse or (with Finger paints on) a finger. Alt + mouse = tilted pencil.</div>
        </div>
        <section id="strip" class="strip" aria-label="Flipbook"></section>
      </div>
      <aside id="panel" class="panel" aria-label="Side panel">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="brush" aria-selected="true">Brush</button>
          <button type="button" role="tab" data-tab="xsheet" aria-selected="false" title="Exposure sheet (Shift+X)">X-sheet</button>
        </div>
        <div id="tab-brush" role="tabpanel"></div>
        <div id="tab-xsheet" role="tabpanel" hidden></div>
      </aside>
    </main>
    <dialog id="export" aria-label="Export"></dialog>
    <div id="quickbar"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <dialog id="versions" aria-label="Versions">
      <h2>Versions</h2>
      <div class="vsave">
        <input type="text" data-v="name" placeholder="Name this version…" maxlength="80" />
        <button type="button" data-v="save">Save version</button>
      </div>
      <div data-v="list" class="vlist"></div>
      <div class="vfoot">
        <button type="button" data-v="json" title="project.json only, without images: for scripts, diffing and version control">Export JSON only</button>
        <button type="button" data-v="close">Close</button>
      </div>
    </dialog>
    <noscript><p class="bootfail">2Dope needs JavaScript. Please turn it on for this site.</p></noscript>
    <script>
      // If the app has not started after a few seconds, say why instead of leaving bare buttons.
      setTimeout(function () {
        if (window.__2dopeBooted) return;
        var d = document.createElement("div");
        d.className = "bootfail";
        d.style.cssText = "margin:16px;padding:14px 16px;border:1px solid #ff5a8a;border-radius:10px;background:#2a1d24;color:#e8e8ee;font:15px/1.5 system-ui,sans-serif";
        d.innerHTML =
          "<b>2Dope did not start.</b> The app code failed to load. Try a hard refresh (Ctrl+F5). " +
          "If you run this site: GitHub Pages must be set to <i>Source: GitHub Actions</i> (Settings, Pages), not <i>Deploy from a branch</i>, " +
          "because the app has to be built first. Details: see the README.";
        document.body.prepend(d);
      }, 4000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
