<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>2Dope</title>
  </head>
  <body>
    <button type="button" id="dock" class="dock" data-icon="menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" title="Menu: files, view, interface">Menu</button>
    <div id="menu" class="menu" role="menu" hidden>
      <section>
        <h3>Help</h3>
        <div class="menu-grid">
          <button type="button" data-menu="manual" title="How everything works, in plain steps (?)">Manual</button>
          <button type="button" data-menu="updates" class="news-btn" title="What changed in 2Dope lately">What’s new</button>
        </div>
      </section>
      <section>
        <h3>Project</h3>
        <div class="menu-grid">
          <button type="button" data-file="projects" title="All your projects and folders on this device">Projects…</button>
          <button type="button" data-file="new" title="Start a new project (this one stays saved in Projects)">New project</button>
          <button type="button" data-file="versions" title="Restore points of this project">Versions…</button>
          <button type="button" data-file="save" title="Download a .2dope file: a backup you keep, or to move to another device">Export .2dope</button>
          <button type="button" data-file="open" title="Bring a .2dope file into your projects">Import .2dope…</button>
          <button type="button" data-action="export" title="Export this frame as PNG with alpha">Export frame (PNG)</button>
          <button type="button" data-menu="export-seq" title="Export the whole shot as PNG sequences">Export sequence…</button>
          <button type="button" data-menu="export-hub">Share and export…</button>
          <button type="button" data-menu="export-video" title="Save a video of the whole shot">Export video…</button>
          <button type="button" data-menu="blender" title="A package Blender opens with the 2Dope add-on: image planes, camera, precomps, keyframes">Export for Blender</button>
        </div>
        <input id="openfile" type="file" accept=".2dope,.zip,.json,application/zip,application/json" hidden />
        <p class="menu-note"><span id="storage" class="readout"></span></p>
      </section>
      <section>
        <h3>View</h3>
        <div class="menu-grid four">
          <button type="button" data-action="fit" title="Fit (F)">Fit</button>
          <button type="button" data-action="actual" title="100% (1)">100%</button>
          <button type="button" data-action="rotate0" title="Reset rotation (0)">0°</button>
          <button type="button" data-action="flip" title="Flip view (H)">Flip</button>
        </div>
        <p class="menu-note"><span id="viewinfo" class="readout"></span></p>
      </section>
      <section>
        <h3>Drawing</h3>
        <div class="menu-grid">
          <button type="button" data-action="clear" title="Clear this drawing (undoable)">Clear drawing</button>
          <label class="check"><input id="finger" type="checkbox" /> Finger paints</label>
        </div>
      </section>
      <section>
        <h3>Interface</h3>
        <div class="menu-grid">
          <button type="button" data-menu="settings" data-icon="gear" title="App settings: student profiles, tools, drawing options, QuickMenu and gestures">App settings</button>
        </div>
        <div class="menu-grid workspaces">
          <button type="button" data-ws="board">Board</button>
          <button type="button" data-ws="draw">Draw</button>
          <button type="button" data-ws="animate">Animate</button>
          <button type="button" data-ws="time">Time</button>
          <button type="button" data-ws="motion">Motion</button>
        </div>
        <div class="menu-grid">
          <button type="button" data-menu="backout" title="Leave the precomp you are in" hidden>⤴ Back out of comp</button>
          <button type="button" data-menu="quick" title="Quick Animate (Tab)">Quick Animate</button>
          <button type="button" data-menu="reference" data-icon="image" title="A floating window of pictures to draw from, or the whole canvas">Reference</button>
          <button type="button" data-menu="panel" title="Brush settings and X-sheet">Brush / X-sheet panel</button>
          <button type="button" data-menu="bar" title="Show or hide the toolbar">Toolbar on/off</button>
          <button type="button" data-action="hide" title="Hide everything but this menu button (Shift+Tab, four-finger tap)">Hide / show interface</button>
        </div>
        <h3>Device</h3>
        <div class="menu-grid three" role="group" aria-label="Device mode">
          <button type="button" data-device="auto" title="Pick Lite or Full from what this device can take">Auto</button>
          <button type="button" data-device="lite" title="Lighter app for phones and older tablets: smaller pages, fewer drawings in memory">Lite</button>
          <button type="button" data-device="full" title="Everything, even on a small device">Full</button>
        </div>
        <p class="menu-note" id="device-info"></p>
      </section>
    </div>
    <header class="topbar">
      <div class="tb-left">
        <button type="button" id="open-gallery" class="gbtn" data-icon="gallery" title="All your projects">Projects</button>
        <div class="group seg ws" id="ws" role="group" aria-label="Workspace">
          <button type="button" data-ws="board" data-icon="board" title="Board: storyboard and animatic (panels, dialogue, timing)">Board</button>
          <button type="button" data-ws="draw" data-icon="draw" title="Draw: the canvas and the flipbook strip">Draw</button>
          <button type="button" data-ws="animate" data-icon="flipbook" title="Animate: draw frames and arrange clips">Animate</button><button type="button" data-ws="time" data-icon="time" title="Time: the exposure sheet">Time</button>
          <button type="button" data-ws="motion" data-icon="motion" title="Motion: layers, keyframes and the camera">Motion</button>
        </div>
        <div class="group file" role="group" aria-label="Project">
          <input id="pname" type="text" placeholder="Untitled" maxlength="60" aria-label="Project name" />
          <button type="button" id="crumb" class="crumbbtn" hidden title="You are inside a precomp. Tap to go back out."></button>
          <span id="savestatus" class="readout" role="status"></span>
        </div>
      </div>
      <span class="spacer"></span>
      <div class="tb-right">
        <div class="group icons" role="group" aria-label="Layers">
          <button type="button" id="layers-btn" data-icon="layers" title="Layers: pick the layer to draw on, show, hide, lock, add">Layers</button>
        </div>
        <div class="group seg planes" role="group" aria-label="Paint on" title="What brushes and the eraser paint on (X): LINE = your ink, on top; FILL = colour, always under the ink">
          <button type="button" data-plane="line" data-icon="lineplane" title="Line: select the vector Pen (X)">Line</button>
          <button type="button" data-plane="fill" data-icon="fillplane" title="Fill: select the Bucket in Tap / drag mode (X)">Fill</button>
        </div>
        <div class="group seg icons parts" role="group" aria-label="Show parts" title="Show or hide the lines or the colour of this layer (the whole shot)">
          <button type="button" data-part-eye="line" data-icon="eye" title="Show / hide this layer's LINE (ink)">Line</button>
          <button type="button" data-part-eye="fill" data-icon="eye" title="Show / hide this layer's FILL (colour)">Fill</button>
        </div>
        <div class="group tools icons" role="group" aria-label="Tools">
          <button type="button" data-tool="brush" data-icon="brush" title="Brush (B). Tap again for the brush library">Brush</button>
          <button type="button" data-tool="pen" data-icon="pen" title="Vector pen (P). Tap again for the brush library">Vector</button>
          <button type="button" data-tool="fill" data-icon="fill" title="Fill (G). Select an area, fill connected regions, or clean leftovers">Fill</button>
          <button type="button" data-tool="eraser" data-icon="eraser" title="Eraser (E). Tap again for the brush library">Eraser</button>
          <button type="button" data-tool-x="smudge" data-icon="smudge" title="Smudge: drag the paint under your stroke along">Smudge</button>
          <button type="button" data-tool-x="select" data-icon="lasso" title="Select: freehand, rectangle, ellipse or automatic; then move, copy, fill or delete it">Select</button>
          <button type="button" data-tool-x="adjust" data-icon="adjust" title="Adjust: hue, saturation, brightness or blur of this drawing">Adjust</button>
        </div>
        <label class="colorchip" title="Colour">
          <input id="color-chip" type="color" aria-label="Colour" />
        </label>
        <div class="group icons" role="group" aria-label="More">
          <button type="button" id="ripple-btn" data-icon="ripple" title="Ripple (Shift+R): a change moves everything after it, on every timeline. Hold Alt to flip it for one edit.">Ripple</button>
          <button type="button" id="panel-toggle" data-icon="panel" title="Brush settings and X-sheet">Panel</button>
          <button type="button" id="enter-quick" data-icon="quick" title="Quick Animate: just the canvas, a slim strip and the essentials (Tab)">Quick</button>
          <button type="button" id="export-seq" data-icon="export" title="Share: watch the movie, then make a video, GIF, pictures, storyboard, Blender package or project backup">Share</button>
          <button type="button" id="bar-collapse" data-icon="collapse" title="Shrink the toolbar to the menu button" aria-label="Hide toolbar">Hide</button>
        </div>
      </div>
    </header>
    <nav class="focusbar" aria-label="Workspace layout">
      <span id="focus-context"></span>
      <button id="focus-tools" type="button" data-icon="panel" aria-expanded="true">Tools</button>
      <button id="focus-timeline" type="button" aria-expanded="true" data-icon="time" aria-controls="strip board motion splitter">Timeline</button>
      <button id="focus-export" type="button" data-icon="export">Share</button>
    </nav>
    <main class="workspace">
      <div class="stage-col">
        <div id="stage" class="stage">
          <canvas id="canvas" aria-label="Drawing canvas"></canvas>
          <div id="sidebar" class="sidebar" aria-label="Brush size, opacity, undo and redo">
            <div class="vslider" data-slider="size" role="slider" tabindex="0" aria-label="Brush size" title="Brush size: drag up or down ( [ and ] )"><div class="vfill"></div><span class="vval"></span></div>
            <button type="button" id="eyedrop" class="eyedrop" data-icon="eyedrop" aria-pressed="false" title="Eyedropper (I): tap, then tap the colour you want on the canvas">Eyedropper</button>
            <div class="vslider" data-slider="opacity" role="slider" tabindex="0" aria-label="Brush opacity" title="Brush opacity: drag up or down"><div class="vfill"></div><span class="vval"></span></div>
            <button type="button" data-action="undo" data-icon="undo" title="Undo (Ctrl+Z, two-finger tap)">Undo</button>
            <button type="button" data-action="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z, three-finger tap)">Redo</button>
          </div>
          <div id="subtitle" class="subtitle" aria-live="polite" hidden></div>
          <div id="stats" class="stats">Draw with a pen, mouse or (with Finger paints on) a finger. Alt + mouse = tilted pencil.</div>
        </div>
        <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Drag to resize the timeline (double-tap to reset)" tabindex="0"></div>
        <section id="strip" class="strip" aria-label="Flipbook"></section>
        <section id="board" class="board" aria-label="Storyboard"></section>
        <section id="motion" class="motion" aria-label="Layers and keyframes"></section>
      </div>
      <aside id="panel" class="panel" aria-label="Side panel">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="brush" aria-selected="true">Brush</button>
          <button type="button" role="tab" data-tab="xsheet" aria-selected="false" title="Exposure sheet (Shift+X)">X-sheet</button>
        </div>
        <div id="tab-brush" role="tabpanel"></div>
        <div id="tab-xsheet" role="tabpanel" hidden></div>
      </aside>
    </main>
    <section id="gallery" class="gallery" aria-label="Projects" hidden></section>
    <dialog id="export" aria-label="Export"></dialog>
    <div id="quickbar"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <dialog id="versions" aria-label="Versions">
      <h2>Versions</h2>
      <div class="vsave">
        <input type="text" data-v="name" placeholder="Name this version…" maxlength="80" />
        <button type="button" data-v="save">Save version</button>
      </div>
      <div data-v="list" class="vlist"></div>
      <div class="vfoot">
        <button type="button" data-v="json" title="project.json only, without images: for scripts, diffing and version control">Export JSON only</button>
        <button type="button" data-v="close">Close</button>
      </div>
    </dialog>
    <noscript><p class="bootfail">2Dope needs JavaScript. Please turn it on for this site.</p></noscript>
    <script>
      // If the app has not started after a few seconds, say why instead of leaving bare buttons.
      setTimeout(function () {
        if (window.__2dopeBooted) return;
        var d = document.createElement("div");
        d.className = "bootfail";
        d.style.cssText = "margin:16px;padding:14px 16px;border:1px solid #ff5a8a;border-radius:12px;background:#2a1d24;color:#e8e8ee;font:15px/1.5 system-ui,sans-serif";
        d.innerHTML =
          "<b>2Dope did not start.</b> The app code failed to load. Try a hard refresh (Ctrl+F5). " +
          "If you run this site: GitHub Pages must be set to <i>Source: GitHub Actions</i> (Settings, Pages), not <i>Deploy from a branch</i>, " +
          "because the app has to be built first. Details: see the README.";
        document.body.prepend(d);
      }, 4000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
