<!doctype html>
<meta charset="utf-8">
<title>2Dope isolated QuickShape check</title>
<style>body{margin:0;font:14px system-ui;background:#eee;color:#222}header{padding:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{padding:8px}iframe{width:100%;height:calc(100vh - 100px);border:0}</style>
<header><strong>QA only · scripted pointer fixtures, not physical pen input</strong><button data-shape="ellipse">Draw narrow oval</button><button data-shape="line">Draw noisy line</button><span id="result">Create a test project in the app below first. Test origin storage is separate.</span></header>
<iframe src="../dist/index.html" title="Production 2Dope test build"></iframe>
<script>
const frame = document.querySelector('iframe');
for (const button of document.querySelectorAll('[data-shape]')) button.onclick = async () => {
  const doc = frame.contentDocument, canvas = doc.querySelector('#canvas');
  if (!canvas || [...doc.querySelectorAll('[role="dialog"]')].some(el => el.getClientRects().length)) { document.querySelector('#result').textContent = 'Finish creating the test project first.'; return; }
  document.querySelectorAll('header button').forEach(b => b.disabled = true);
  const rect = canvas.getBoundingClientRect(), cx = rect.width / 2, cy = rect.height / 2;
  const send = (type, p, buttons = 1) => canvas.dispatchEvent(new frame.contentWindow.PointerEvent(type, { bubbles:true, pointerId:9999, pointerType:'pen', isPrimary:true, button:0, buttons, pressure:buttons ? 0.55 : 0, clientX:rect.left+p.x, clientY:rect.top+p.y }));
  const points = button.dataset.shape === 'ellipse' ? Array.from({length:121},(_,i)=>{const a=.7+i/120*Math.PI*2;return{x:cx+120*Math.cos(a),y:cy+30*Math.sin(a)};}) : Array.from({length:81},(_,i)=>({x:cx-100+i*2.5,y:cy+(i===80?8:Math.sin(i)*.4)}));
  try {
    send('pointerdown', points[0]);
    for (const p of points.slice(1)) { send('pointermove', p); await new Promise(resolve=>setTimeout(resolve,8)); }
    // A real hold passes through the app's hold timer and normal QuickShape handler.
    await new Promise(resolve=>setTimeout(resolve,950));
  } finally {
    send('pointerup',points[points.length-1],0);
    document.querySelector('#result').textContent = 'Finished stroke: '+(doc.querySelector('.shape-pop')?.textContent || 'inspect the canvas');
    document.querySelectorAll('header button').forEach(b=>b.disabled=false);
  }
};
</script>
