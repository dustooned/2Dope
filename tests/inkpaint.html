<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink and Paint checks</title>
<link rel="stylesheet" href="../src/style.css"><style>#report{position:fixed;z-index:100;right:8px;top:66px;max-width:45%;font-size:10px;background:#16161ce8;padding:6px;max-height:130px;overflow:auto;pointer-events:none}#report ol{padding-left:20px}#canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<body class="ui-simple"><div class="workspace"><div class="stage-col"><div id="stage" class="stage"><canvas id="canvas" aria-label="Drawing canvas"></canvas><div id="sidebar" class="sidebar" aria-label="Brush size, opacity, undo and redo">
<div class="vslider" data-slider="size" role="slider" tabindex="0" aria-label="Brush size"><div class="vfill"></div><span class="vval"></span></div><button type="button" id="eyedrop" class="eyedrop" aria-label="Eyedropper">I</button><div class="vslider" data-slider="opacity" role="slider" tabindex="0" aria-label="Brush opacity"><div class="vfill"></div><span class="vval"></span></div><button type="button" data-action="undo" aria-label="Undo">↶</button><button type="button" data-action="redo" aria-label="Redo">↷</button></div></div><section id="strip" class="strip"></section></div></div>
<aside id="report"><strong id="summary">Running…</strong><ol id="results"></ol></aside><script type="module" src="../src/ui/inkpaint.browser.ts"></script></body></html>
