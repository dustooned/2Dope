<!doctype html><html lang="en"><meta charset="utf-8"><title>Creation tools responsive checks</title><body><strong id="summary">Running…</strong><ol id="results"></ol><div id="viewport"></div><script type="module">
const sizes=[[375,812],[768,1024],[812,375]],results=document.querySelector('#results');let passed=0,failed=0;
for(const [width,height] of sizes){const frame=document.createElement('iframe');frame.width=String(width);frame.height=String(height);frame.src='./creationtools.html';document.querySelector('#viewport').append(frame);const end=performance.now()+60000;await new Promise(resolve=>{const poll=setInterval(()=>{const doc=frame.contentDocument,summary=doc?.querySelector('#summary')?.textContent??'',m=/^(\d+) passed, (\d+) failed/.exec(summary);if(m){clearInterval(poll);passed+=Number(m[1]);failed+=Number(m[2]);for(const li of doc.querySelectorAll('#results li'))if(li.textContent?.startsWith('FAIL')){const item=document.createElement('li');item.textContent=`${li.textContent} (${width}×${height})`;results.append(item);}resolve();}else if(performance.now()>end){clearInterval(poll);failed++;const li=document.createElement('li');li.textContent=`FAIL: ${width}×${height} timed out`;results.append(li);resolve();}},200);});frame.remove();}
document.querySelector('#summary').textContent=`${passed} passed, ${failed} failed · phone, tablet, landscape`;
</script></body></html>
