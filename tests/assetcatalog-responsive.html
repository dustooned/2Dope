<!doctype html><html lang="en"><meta charset="utf-8"><title>Asset catalog responsive checks</title><strong id="summary">Running…</strong><ol id="results"></ol><div id="viewport"></div><script type="module">
let passed=0,failed=0;for(const [width,height] of [[375,812],[768,1024],[812,375]]){const frame=document.createElement('iframe');frame.width=width;frame.height=height;frame.src='./assetcatalog.html';document.querySelector('#viewport').replaceChildren(frame);await new Promise(resolve=>{const end=performance.now()+90000,poll=setInterval(()=>{const doc=frame.contentDocument,m=/^(\d+) passed, (\d+) failed/.exec(doc?.querySelector('#summary')?.textContent??'');if(m){clearInterval(poll);passed+=+m[1];failed+=+m[2];for(const li of doc.querySelectorAll('#results li'))if(li.textContent.startsWith('FAIL')){const row=document.createElement('li');row.textContent=`${li.textContent} (${width}×${height})`;document.querySelector('#results').append(row);}resolve();}else if(performance.now()>end){clearInterval(poll);failed++;resolve();}},200);});}document.querySelector('#summary').textContent=`${passed} passed, ${failed} failed · phone, tablet, landscape`;
</script></html>
